version: '3.8'

services:
  # 1. The Graph Database
  neo4j:
    image: neo4j:latest
    container_name: apexminerals-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    networks:
      - apex-network

  # 2. The Python FastAPI & ML Backend
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: apexminerals-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - neo4j
    networks:
      - apex-network

  # 3. The Next.js Command Center UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apexminerals-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - apex-network

networks:
  apex-network:
    driver: bridge